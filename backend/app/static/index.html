<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimodal AI Assistant | Local & Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-600/30">
          <i class="fa-solid fa-sparkles text-sm"></i>
        </div>
        <span class="font-bold text-sm tracking-tight text-white">Multimodal AI</span>
      </div>

      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="gpu-status">RTX 3050 Ti • Local</span>
      </span>
    </div>
  </header>

  <!-- Main Unified Container -->
  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 flex flex-col w-full">
    
    <!-- Hero (Welcome Screen) -->
    <div id="hero" class="text-center my-auto py-12 transition-all">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center mx-auto text-white text-2xl shadow-xl shadow-indigo-500/20 mb-5">
        <i class="fa-solid fa-brain"></i>
      </div>
      <h2 class="text-3xl font-bold text-white tracking-tight">Ask anything across your media</h2>
      <p class="text-sm text-slate-400 mt-2 max-w-md mx-auto">
        Search documents, listen to audio, inspect images, and pinpoint video scenes—all in one place.
      </p>

      <!-- Quick Suggested Questions -->
      <div class="flex flex-wrap justify-center gap-2 mt-6 max-w-lg mx-auto">
        <button onclick="submitQuery('How do I maintain my car engine and prevent wear?')" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition flex items-center gap-2">
          <span>🚗 Car maintenance advice</span>
        </button>
        <button onclick="submitQuery('red sports car speeding on the highway')" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition flex items-center gap-2">
          <span>🏎️ Red sports car</span>
        </button>
        <button onclick="submitQuery('emergency warning siren beep and alarm sound')" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition flex items-center gap-2">
          <span>🚨 Siren alarm sound</span>
        </button>
        <button onclick="submitQuery('silicon microchip and printed circuit board')" class="px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition flex items-center gap-2">
          <span>💻 Circuit board in video</span>
        </button>
      </div>
    </div>

    <!-- Unified Results Area -->
    <div id="results-area" class="space-y-6 hidden mb-8">
      
      <!-- User Query -->
      <div class="flex items-start gap-3">
        <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs text-slate-400 shrink-0 mt-0.5">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="text-base font-semibold text-white pt-0.5" id="user-query-text"></div>
      </div>

      <!-- AI Answer (Grounded Synthesis) -->
      <div class="bg-slate-900/80 rounded-2xl p-5 border border-slate-800/80 shadow-lg">
        <div class="flex items-center gap-2 text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">
          <i class="fa-solid fa-sparkles"></i> AI Answer
        </div>
        <div id="ai-answer-text" class="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap font-normal"></div>
      </div>

      <!-- Evidence & Matching Media Cards -->
      <div class="space-y-3">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
          <span>Matching Evidence</span>
          <span id="speed-tag" class="font-mono text-slate-500 text-[11px]"></span>
        </div>
        <div id="evidence-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

    </div>

    <!-- Bottom Unified Input Bar -->
    <div class="mt-auto sticky bottom-4 z-40">
      
      <!-- Upload Alert -->
      <div id="upload-status" class="hidden mb-2 px-3 py-2 rounded-xl bg-indigo-950/80 border border-indigo-800 text-xs text-indigo-300 text-center animate-fade-in shadow-lg"></div>

      <!-- Search Box Container -->
      <div class="bg-slate-900 border border-slate-800 focus-within:border-indigo-500 rounded-2xl p-2 shadow-2xl transition">
        
        <form id="search-form" class="flex items-center gap-2">
          
          <!-- Hidden File Upload -->
          <input type="file" id="file-input" class="hidden" accept=".txt,.md,.pdf,.png,.jpg,.jpeg,.wav,.mp3,.mp4,.mkv">
          <button 
            type="button" 
            onclick="document.getElementById('file-input').click()" 
            title="Attach any file (Documents, Photos, Audio, Video)" 
            class="w-10 h-10 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition shrink-0"
          >
            <i class="fa-solid fa-plus text-sm"></i>
          </button>

          <!-- Input Field -->
          <input 
            type="text" 
            id="query-input" 
            placeholder="Ask a question or search your files..." 
            class="flex-1 bg-transparent text-sm placeholder-slate-500 outline-none text-slate-100 py-2"
            required
            autocomplete="off"
          >

          <!-- Send Button -->
          <button 
            type="submit" 
            id="send-btn" 
            class="w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white flex items-center justify-center transition shrink-0 shadow-md shadow-indigo-600/30"
          >
            <i class="fa-solid fa-arrow-up text-sm"></i>
          </button>
        </form>
      </div>

      <p class="text-[11px] text-slate-500 text-center mt-2">
        Powered by Google EmbeddingGemma-2 & Qwen2.5 on your local RTX 3050 Ti GPU • 100% Free
      </p>
    </div>

  </main>

  <script>
    // Quick prompt submit
    function submitQuery(text) {
      document.getElementById('query-input').value = text;
      document.getElementById('search-form').dispatchEvent(new Event('submit'));
    }

    // Unified Form Submit (Automatically does Search + RAG Answer)
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('query-input');
      const query = input.value.trim();
      if (!query) return;

      const hero = document.getElementById('hero');
      const resultsArea = document.getElementById('results-area');
      const userQueryText = document.getElementById('user-query-text');
      const aiAnswerText = document.getElementById('ai-answer-text');
      const sendBtn = document.getElementById('send-btn');
      const speedTag = document.getElementById('speed-tag');

      // Update UI
      hero.classList.add('hidden');
      resultsArea.classList.remove('hidden');
      userQueryText.textContent = query;
      aiAnswerText.innerHTML = '<span class="text-slate-400 italic flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> Searching files and generating answer...</span>';
      sendBtn.disabled = true;

      const startTime = performance.now();

      try {
        const res = await fetch('/query/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: query, top_k: 4 })
        });

        const data = await res.json();
        const elapsed = Math.round(performance.now() - startTime);
        speedTag.textContent = `${elapsed}ms`;

        aiAnswerText.textContent = data.answer || 'No direct answer returned.';
        renderEvidence(data.sources || []);
      } catch (err) {
        aiAnswerText.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        input.value = '';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    });

    // Render Evidence Cards
    function renderEvidence(sources) {
      const grid = document.getElementById('evidence-grid');
      grid.innerHTML = '';

      if (!sources || sources.length === 0) {
        grid.innerHTML = '<p class="text-xs text-slate-500 italic col-span-2">No matching files found.</p>';
        return;
      }

      sources.forEach(item => {
        const mod = (item.modality || 'text').toLowerCase();
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col justify-between hover:border-slate-700 transition';

        let badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">DOCUMENT</span>';
        if (mod === 'image') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">IMAGE</span>';
        if (mod === 'audio') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">AUDIO</span>';
        if (mod === 'video') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-pink-500/10 text-pink-400 border border-pink-500/20">VIDEO</span>';

        const filename = item.content ? item.content.split('/').pop() : item.source;
        let preview = '';

        if (mod === 'image') {
          preview = `
            <div class="mt-2.5 rounded-lg overflow-hidden border border-slate-800 aspect-video bg-black flex items-center justify-center">
              <img src="/uploads/${filename}" alt="${item.title}" class="w-full h-full object-cover">
            </div>`;
        } else if (mod === 'audio') {
          preview = `
            <div class="mt-2.5">
              <audio controls class="w-full h-8 rounded bg-slate-950">
                <source src="/uploads/${filename}" type="audio/wav">
              </audio>
            </div>`;
        } else if (mod === 'video') {
          preview = `
            <div class="mt-2.5 rounded-lg overflow-hidden border border-slate-800 aspect-video relative bg-black flex items-center justify-center">
              <img src="/uploads/frames/${filename}" alt="${item.title}" class="w-full h-full object-cover">
              <span class="absolute bottom-1.5 right-1.5 bg-black/80 font-mono text-[10px] text-white px-1.5 py-0.5 rounded border border-white/20">
                Keyframe
              </span>
            </div>`;
        } else {
          preview = `
            <div class="mt-2.5 p-2 rounded bg-slate-950 text-[11px] text-slate-300 font-mono max-h-20 overflow-y-auto leading-relaxed border border-slate-800/80">
              ${item.content || item.title}
            </div>`;
        }

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-xs mb-1">
              ${badge}
              <span class="text-[11px] font-mono text-slate-400">Match: ${Math.round((item.similarity || 0) * 100)}%</span>
            </div>
            <div class="text-xs font-semibold text-white truncate">${item.title || filename}</div>
            <div class="text-[11px] text-slate-500 truncate">${item.source}</div>
          </div>
          ${preview}
        `;
        grid.appendChild(card);
      });
    }

    // File Upload Handler
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const status = document.getElementById('upload-status');
      status.classList.remove('hidden');
      status.className = 'mb-2 px-3 py-2 rounded-xl bg-indigo-950/80 border border-indigo-800 text-xs text-indigo-300 text-center animate-fade-in shadow-lg';
      status.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Indexing <b>${file.name}</b>...`;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/ingest/file', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          status.className = 'mb-2 px-3 py-2 rounded-xl bg-emerald-950/80 border border-emerald-800 text-xs text-emerald-300 text-center animate-fade-in shadow-lg';
          status.innerHTML = `<i class="fa-solid fa-check mr-1.5"></i> Successfully indexed <b>${data.filename}</b> into LanceDB!`;
          setTimeout(() => status.classList.add('hidden'), 5000);
          checkHealth();
        } else {
          status.className = 'mb-2 px-3 py-2 rounded-xl bg-red-950/80 border border-red-800 text-xs text-red-300 text-center animate-fade-in shadow-lg';
          status.textContent = 'Upload failed: ' + (data.detail || 'Unknown error');
        }
      } catch (err) {
        status.className = 'mb-2 px-3 py-2 rounded-xl bg-red-950/80 border border-red-800 text-xs text-red-300 text-center animate-fade-in shadow-lg';
        status.textContent = 'Upload failed: ' + err.message;
      }
    });

    // GPU Health Status
    async function checkHealth() {
      try {
        const res = await fetch('/health/');
        const data = await res.json();
        if (data.device) {
          document.getElementById('gpu-status').textContent = `${data.device.replace('NVIDIA GeForce ', '').replace(' Laptop GPU', '')} • ${data.total_documents_indexed} items`;
        }
      } catch (e) {}
    }
    checkHealth();
  </script>
</body>
</html>
