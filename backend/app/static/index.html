<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimodal AI Assistant | Local & Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Minimal Nav -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-600/20">
          <i class="fa-solid fa-sparkles text-sm"></i>
        </div>
        <span class="font-bold text-sm tracking-tight text-white">Multimodal AI</span>
      </div>

      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="gpu-status">RTX 3050 Ti • Local</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Centered Content -->
  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 flex flex-col w-full">
    
    <!-- Hero / Welcome Header -->
    <div id="hero" class="text-center my-auto py-10 transition-all duration-300">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center mx-auto text-white text-2xl shadow-xl shadow-indigo-500/20 mb-4">
        <i class="fa-solid fa-brain"></i>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">What would you like to find?</h2>
      <p class="text-sm text-slate-400 mt-2 max-w-md mx-auto">
        Search and ask questions across your documents, images, audio clips, and video keyframes.
      </p>

      <!-- Quick Suggested Prompts -->
      <div class="flex flex-wrap justify-center gap-2 mt-6">
        <button onclick="setQuery('How do I maintain my car engine and prevent wear?')" class="px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition">
          🚗 Engine maintenance
        </button>
        <button onclick="setQuery('red sports car speeding on the highway')" class="px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition">
          🏎️ Red car in video & image
        </button>
        <button onclick="setQuery('emergency warning siren beep and alarm sound')" class="px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition">
          🚨 Siren alarm sound
        </button>
        <button onclick="setQuery('silicon microchip and printed circuit board')" class="px-3 py-1.5 rounded-full bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs text-slate-300 transition">
          💻 Circuit board keyframe
        </button>
      </div>
    </div>

    <!-- Results Section (Initially Hidden) -->
    <div id="results-area" class="space-y-6 hidden mb-8">
      
      <!-- User Query Echo -->
      <div class="flex items-start gap-3">
        <div class="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs text-slate-400 shrink-0 mt-0.5">
          <i class="fa-solid fa-user"></i>
        </div>
        <div class="text-sm font-medium text-slate-200 pt-1" id="query-display"></div>
      </div>

      <!-- AI Answer Card -->
      <div class="flex items-start gap-3 bg-slate-900/60 rounded-2xl p-5 border border-slate-800">
        <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs text-white shrink-0 mt-0.5 shadow-md shadow-indigo-600/30">
          <i class="fa-solid fa-sparkles"></i>
        </div>
        <div class="flex-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-1.5">AI Answer</div>
          <div id="ai-answer" class="text-sm text-slate-200 leading-relaxed whitespace-pre-wrap"></div>
        </div>
      </div>

      <!-- Sources / Evidence Grid -->
      <div id="sources-container" class="space-y-3">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
          <span>Sources & Evidence</span>
          <span id="timing-badge" class="font-mono text-slate-500 text-[11px]"></span>
        </div>
        <div id="sources-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </div>

    </div>

    <!-- Fixed / Sticky Bottom Search Box (ChatGPT style) -->
    <div class="mt-auto sticky bottom-4 z-40">
      
      <!-- Upload notification badge -->
      <div id="upload-status" class="hidden mb-2 px-3 py-1.5 rounded-lg bg-indigo-950/80 border border-indigo-800 text-xs text-indigo-300 text-center animate-fade-in"></div>

      <!-- Input Bar Container -->
      <div class="bg-slate-900 border border-slate-800 focus-within:border-indigo-500 rounded-2xl p-2 shadow-2xl transition">
        
        <!-- Filter Tabs (Clean Pills) -->
        <div class="flex items-center gap-1 px-2 pb-2 border-b border-slate-800/80 text-xs overflow-x-auto">
          <span class="text-[11px] text-slate-500 font-medium mr-1">Filter:</span>
          <button data-modality="" class="mod-pill active px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium text-[11px] transition">All</button>
          <button data-modality="text" class="mod-pill px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 font-medium text-[11px] transition">📄 Text</button>
          <button data-modality="image" class="mod-pill px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 font-medium text-[11px] transition">🖼️ Images</button>
          <button data-modality="audio" class="mod-pill px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 font-medium text-[11px] transition">🎵 Audio</button>
          <button data-modality="video" class="mod-pill px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 font-medium text-[11px] transition">🎬 Video</button>
        </div>

        <!-- Text Input & Buttons -->
        <form id="search-form" class="flex items-center gap-2 pt-2 px-2">
          
          <!-- Hidden File Upload -->
          <input type="file" id="file-input" class="hidden" accept=".txt,.md,.pdf,.png,.jpg,.jpeg,.wav,.mp3,.mp4,.mkv">
          <button 
            type="button" 
            onclick="document.getElementById('file-input').click()" 
            title="Upload any file (Text, Image, Audio, Video)" 
            class="w-9 h-9 rounded-xl hover:bg-slate-800 text-slate-400 hover:text-slate-200 flex items-center justify-center transition shrink-0"
          >
            <i class="fa-solid fa-paperclip text-sm"></i>
          </button>

          <!-- Input -->
          <input 
            type="text" 
            id="query-input" 
            placeholder="Ask a question or search across all media..." 
            class="flex-1 bg-transparent text-sm placeholder-slate-500 outline-none text-slate-100"
            required
            autocomplete="off"
          >

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="send-btn" 
            class="w-9 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white flex items-center justify-center transition shrink-0 shadow-md shadow-indigo-600/30"
          >
            <i class="fa-solid fa-arrow-up text-sm"></i>
          </button>
        </form>
      </div>

      <p class="text-[11px] text-slate-500 text-center mt-2">
        Runs 100% locally on your RTX 3050 Ti GPU • No data leaves your machine • $0 cloud cost
      </p>
    </div>

  </main>

  <script>
    let activeModality = '';

    // Quick Prompt
    function setQuery(text) {
      document.getElementById('query-input').value = text;
      document.getElementById('search-form').dispatchEvent(new Event('submit'));
    }

    // Modality Filter Pills
    document.querySelectorAll('.mod-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mod-pill').forEach(b => {
          b.className = 'mod-pill px-2.5 py-1 rounded-md text-slate-400 hover:text-slate-200 font-medium text-[11px] transition';
        });
        btn.className = 'mod-pill active px-2.5 py-1 rounded-md bg-indigo-600 text-white font-medium text-[11px] transition';
        activeModality = btn.getAttribute('data-modality');
      });
    });

    // Form Submit (Ask RAG)
    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('query-input');
      const query = input.value.trim();
      if (!query) return;

      const hero = document.getElementById('hero');
      const resultsArea = document.getElementById('results-area');
      const queryDisplay = document.getElementById('query-display');
      const aiAnswer = document.getElementById('ai-answer');
      const sendBtn = document.getElementById('send-btn');
      const timingBadge = document.getElementById('timing-badge');

      // UI Transition
      hero.classList.add('hidden');
      resultsArea.classList.remove('hidden');
      queryDisplay.textContent = query;
      aiAnswer.innerHTML = '<span class="text-slate-400 italic flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin"></i> Thinking & retrieving multimodal evidence...</span>';
      sendBtn.disabled = true;

      const startTime = performance.now();

      try {
        const res = await fetch('/query/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: query,
            top_k: 4,
            modality: activeModality || null
          })
        });

        const data = await res.json();
        const elapsed = Math.round(performance.now() - startTime);
        timingBadge.textContent = `${elapsed}ms`;

        aiAnswer.textContent = data.answer || 'No direct answer returned.';
        renderSources(data.sources || []);
      } catch (err) {
        aiAnswer.innerHTML = `<span class="text-red-400">Error: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        input.value = '';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      }
    });

    // Render Evidence Cards
    function renderSources(sources) {
      const grid = document.getElementById('sources-grid');
      grid.innerHTML = '';

      if (!sources || sources.length === 0) {
        grid.innerHTML = '<p class="text-xs text-slate-500 italic col-span-2">No direct sources found.</p>';
        return;
      }

      sources.forEach(item => {
        const mod = (item.modality || 'text').toLowerCase();
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-xl p-3 flex flex-col justify-between hover:border-slate-700 transition';

        let badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">TEXT</span>';
        if (mod === 'image') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">IMAGE</span>';
        if (mod === 'audio') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">AUDIO</span>';
        if (mod === 'video') badge = '<span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-pink-500/10 text-pink-400 border border-pink-500/20">VIDEO</span>';

        const filename = item.content ? item.content.split('/').pop() : item.source;
        let preview = '';

        if (mod === 'image') {
          preview = `
            <div class="mt-2 rounded-lg overflow-hidden border border-slate-800 aspect-video bg-black flex items-center justify-center">
              <img src="/uploads/${filename}" alt="${item.title}" class="w-full h-full object-cover">
            </div>`;
        } else if (mod === 'audio') {
          preview = `
            <div class="mt-2">
              <audio controls class="w-full h-7 rounded bg-slate-950">
                <source src="/uploads/${filename}" type="audio/wav">
              </audio>
            </div>`;
        } else if (mod === 'video') {
          preview = `
            <div class="mt-2 rounded-lg overflow-hidden border border-slate-800 aspect-video relative bg-black flex items-center justify-center">
              <img src="/uploads/frames/${filename}" alt="${item.title}" class="w-full h-full object-cover">
              <span class="absolute bottom-1.5 right-1.5 bg-black/80 font-mono text-[10px] text-white px-1.5 py-0.5 rounded border border-white/20">
                Keyframe
              </span>
            </div>`;
        } else {
          preview = `
            <div class="mt-2 p-2 rounded bg-slate-950 text-[11px] text-slate-300 font-mono max-h-20 overflow-y-auto leading-relaxed border border-slate-800/80">
              ${item.content || item.title}
            </div>`;
        }

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-xs mb-1">
              ${badge}
              <span class="text-[11px] font-mono text-slate-400">Match: ${Math.round((item.similarity || 0) * 100)}%</span>
            </div>
            <div class="text-xs font-semibold text-white truncate">${item.title || filename}</div>
            <div class="text-[11px] text-slate-500 truncate">${item.source}</div>
          </div>
          ${preview}
        `;
        grid.appendChild(card);
      });
    }

    // File Upload Handler
    document.getElementById('file-input').addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;

      const status = document.getElementById('upload-status');
      status.classList.remove('hidden');
      status.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Uploading and indexing <b>${file.name}</b>...`;

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/ingest/file', { method: 'POST', body: formData });
        const data = await res.json();
        if (res.ok) {
          status.className = 'mb-2 px-3 py-1.5 rounded-lg bg-emerald-950/80 border border-emerald-800 text-xs text-emerald-300 text-center animate-fade-in';
          status.innerHTML = `<i class="fa-solid fa-check mr-1.5"></i> Ingested <b>${data.filename}</b> into LanceDB (${data.chunks_created} vectors)!`;
          setTimeout(() => status.classList.add('hidden'), 5000);
        } else {
          status.className = 'mb-2 px-3 py-1.5 rounded-lg bg-red-950/80 border border-red-800 text-xs text-red-300 text-center animate-fade-in';
          status.textContent = 'Upload failed: ' + (data.detail || 'Unknown error');
        }
      } catch (err) {
        status.className = 'mb-2 px-3 py-1.5 rounded-lg bg-red-950/80 border border-red-800 text-xs text-red-300 text-center animate-fade-in';
        status.textContent = 'Upload failed: ' + err.message;
      }
    });

    // Check GPU Status
    async function checkHealth() {
      try {
        const res = await fetch('/health/');
        const data = await res.json();
        if (data.device) {
          document.getElementById('gpu-status').textContent = `${data.device.replace('NVIDIA GeForce ', '').replace(' Laptop GPU', '')} • ${data.total_documents_indexed} items`;
        }
      } catch (e) {}
    }
    checkHealth();
  </script>
</body>
</html>
